[build-system]
    requires = ["setuptools","versioneer[toml]","numpy"]
    build-backend = "setuptools.build_meta"

[project]
    name = "astromodels"
    description = "Astromodels contains models to be used in likelihood or Bayesian analysis in astronomy"
    readme = "README.md"
    license = "BSD-3-Clause"
    license-files = ["LICENSE"]
    dynamic = ["version"]

    authors = [
	    {name = "Giacomo Vianello",email = "giacomo.vianello@gmail.com"}
    ]
    maintainers = [
	    {name = "Niccolò Di Lalla",email = "niccolo.dilalla@stanford.edu"}
    ]


    requires-python = ">=3.11.0"
    dependencies = [
	"numpy>=1.26",
	"PyYAML>=6.0",
	"scipy>=1.9.2",
	"astropy>=7.2",
	"dill",
	"numba>=0.57.0",
	"llvmlite<0.46; platform_system == 'Darwin' and platform_machine == 'x86_64'",
	"h5py>=3.8.0",
	"pandas>=1.5.0",
	"tables>=3.8.0",
	"omegaconf",
	"rich",
	"versioneer"
    ]
    classifiers =[
	"Development Status :: 5 - Production/Stable",
	"Topic :: Scientific/Engineering :: Astronomy",
	"Intended Audience :: Science/Research",
	"Operating System :: POSIX",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Environment :: Console",
    ]

[project.optional-dependencies]
    tests = ["pytest","pytest-codecov"]
    docs = [
	"sphinx>=1.4",
	"sphinx_rtd_theme",
	"nbsphinx",
	"sphinx-autoapi"
    ]

[project.urls]
    Documentation = "https://astromodels.readthedocs.io"
    Homepage = "https://github.com/threeML/astromodels"
    Issues = "https://github.com/threeML/astromodels/issues"

[tool.setuptools]
    include-package-data = true

[tool.setuptools.packages.find]
    exclude = ["output"]

[tool.setuptools.package-data]
    astromodels = [
	"astromodels/data/functions/*.yaml",
	"astromodels/data/tests/*.fits",
	"astromodels/data/tests/*.h5",
    ]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "astromodels/_version.py"
versionfile_build = "astromodels/_version.py"
tag_prefix = "v"
parentdir_prefix = "astromodels-"


[tool.pytest.ini_options]
markers = [
    "slow: slow tests",
]

