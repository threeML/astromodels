name: Deploy
on:
    push:        
      paths-ignore:
        - "README.md"
        - "**/docs/**"
        - ".github/workflows/docs.yml"

    pull_request:
      branches:
        - master
        - dev
        
    schedule:
        - cron: "0 11 * * *"

jobs:

    publish-pypi:
        name: Publish to PyPi
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
        runs-on: ubuntu-latest
        permissions:
          # IMPORTANT: this permission is mandatory for trusted publishing
          id-token: write
        steps:
            - name: Checkout source
              uses: actions/checkout@v6
            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: 3.11
            - name: Build package
              run: |
                  pip install wheel setuptools packaging -U
                  python setup.py sdist
            - name: Publish
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  skip-existing: true

    test-publish-pypi:
      name: Build & verify PyPi
      runs-on: ubuntu-latest

      steps:
          - uses: actions/checkout@v6
          - uses: actions/setup-python@v5
            with:
                python-version: 3.11

          - name: Install twine
            run: |
                python -m pip install twine
          - name: Build package
            run: |
              pip install wheel setuptools -U
              python setup.py sdist

          - name: List result
            run: |
                ls -lh dist
          - name: Check long_description
            run: |
                python -m twine check dist/*

    build-conda:
      name: Build for Conda
      runs-on: ${{ matrix.os }}
      strategy:
        fail-fast: false
        matrix:
          include:
            - os: ubuntu-latest
              target-platform: linux-64
            - os: macos-latest
              target-platform: osx-arm64
            - os: ubuntu-24.04-arm
              target-platform: linux-aarch64
            - os: macos-15-intel
              target-platform: osx-64

      steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0        
        
        - name: Setup rattler-build 
          uses: prefix-dev/rattler-build-action@v0.2.37
          with:
            upload-artifact: false
            setup-only: true
            artifact-name: astromodels-${{ matrix.target-platform }}

        - name: Build package
          run: |
            rattler-build build --target-platform ${{ matrix.target-platform }} -c https://heasarc.gsfc.nasa.gov/FTP/software/conda/ -c conda-forge --recipe conda-dist/recipe.yaml --experimental

          env:
              OMP_NUM_THREADS: 1
              MKL_NUM_THREADS: 1
              NUMEXPR_NUM_THREADS: 1
              MPLBACKEND: "Agg"


    publish-conda:
      name: Publish to Conda
      if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
      runs-on: ${{ matrix.os }}
      strategy:
        fail-fast: false
        matrix:
          include:
            - os: ubuntu-latest
              target-platform: linux-64
            - os: macos-latest
              target-platform: osx-arm64
            - os: ubuntu-24.04-arm
              target-platform: linux-aarch64
            - os: macos-15-intel
              target-platform: osx-64

      steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0
        
        - name: Setup rattler-build 
          uses: prefix-dev/rattler-build-action@v0.2.37
          with:
            upload-artifact: false
            setup-only: true
            artifact-name: astromodels-${{ matrix.target-platform }}

        - name: Build package
          run: |

            rattler-build build --target-platform ${{ matrix.target-platform }} -c https://heasarc.gsfc.nasa.gov/FTP/software/conda/ -c conda-forge --recipe conda-dist/recipe.yaml --experimental

            echo "Uploading ${{matrix.os}} IsDev: ${ISDEV} "
            if [[ "${ISDEV}" == "true" ]]; then
              LABEL="--channel dev"
            fi
            rattler-build upload anaconda ${CONDA_BLD_PATH}/${{ matrix.target-platform }}/*.conda --force --owner threeml ${LABEL}

          env:
              OMP_NUM_THREADS: 1
              MKL_NUM_THREADS: 1
              NUMEXPR_NUM_THREADS: 1
              MPLBACKEND: "Agg"
              ANACONDA_API_KEY: ${{secrets.CONDA_UPLOAD_TOKEN}}
              ISDEV: ${{contains(github.ref, 'dev')}}
