name: Deploy
on:
    push:        
      paths-ignore:
        - "README.md"
        - "**/docs/**"
        - ".github/workflows/docs.yml"

    pull_request:
      branches:
        - master
        - dev
        
    schedule:
        - cron: "0 11 * * *"

jobs:

    publish-pypi:
        name: Publish to PyPi
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
        runs-on: ubuntu-latest
        permissions:
          # IMPORTANT: this permission is mandatory for trusted publishing
          id-token: write
        steps:
            - name: Checkout source
              uses: actions/checkout@v6
            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: 3.11
            - name: Build package
              run: |
                  pip install wheel setuptools packaging -U
                  python setup.py sdist
            - name: Publish
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  skip-existing: true

    test-publish-pypi:
      name: Build & verify PyPi
      runs-on: ubuntu-latest

      steps:
          - uses: actions/checkout@v6
          - uses: actions/setup-python@v5
            with:
                python-version: 3.11

          - name: Install twine
            run: |
                python -m pip install twine
          - name: Build package
            run: |
              pip install wheel setuptools -U
              python setup.py sdist

          - name: List result
            run: |
                ls -lh dist
          - name: Check long_description
            run: |
                python -m twine check dist/*
    build-conda:
      name: Build for Conda
      runs-on: ${{ matrix.os }}
      strategy:
        matrix:
          include:
            - os: ubuntu-latest
              target-platform: linux-64
            - os: macos-latest
              target-platform: osx-arm64
            - os: ubuntu-24.04-arm
              target-platform: linux-aarch64
            - os: macos-15-intel
              target-platform: osx-64

      steps:
        - uses: actions/checkout@v6
        
        - name: Clean workspace
          run: |
            # Remove any long-named directories and caches
            find . -type d \( -name "*build*" -o -name "*dist*" -o -name ".rattler*" -o -name ".conda*" \) -exec rm -rf {} + 2>/dev/null || true
            # Clear package caches
            rm -rf ~/.cache/pip ~/.cache/conda 2>/dev/null || true
        
        - name: Build conda package
          uses: prefix-dev/rattler-build-action@v0.2.34
          with:
            upload-artifact: false
            build-args: --target-platform ${{ matrix.target-platform }} -c https://heasarc.gsfc.nasa.gov/FTP/software/conda/ -c conda-forge
            # Add environment variables to control build temp location
          env:
            TMPDIR: /tmp/rattler-build-${{ github.run_id }}
            TMP: /tmp/rattler-build-${{ github.run_id }}

