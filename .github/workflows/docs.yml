name: Docs
on:
  push:
    branches:
      - master
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - dev
  release:

permissions:
  contents: write       # 'write' access to repository contents
  pull-requests: write  # 'write' access to pull requests

jobs:
  notebooks:
    name: "Build the notebooks for the docs"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

      - name: Add conda to system path
        uses: conda-incubator/setup-miniconda@v3
        with:
            activate-environment: "test_env"
            auto-activate-base: false
            miniforge-version: latest
            python-version: "3.11"
            auto-update-conda: true
            environment-file: "ci/environment.yml"
            use-only-tar-bz2: false
            channel-priority: true

      - name: Init Environment
        shell: bash -l {0}
        run: |
          
          brew update
          brew install --cask basictex

          eval "$(/usr/libexec/path_helper)"

          brew install lzo c-blosc

          pip install tempita jupytext jupyterthemes jupyter_latex_envs jupyter notebook papermill matplotlib tables healpy ebltable black cython pkgconfig wheel

      - name: Install the package
        shell: bash -l {0}
        run: |

          pip install -e .
          
      - name: Execute the notebooks
        shell: bash -l {0}
        run: |
          # Make sure we fail in case of error
          set -e
          # Download an example file
          
          wget https://www.astropy.org/astropy-data/photometry/spitzer_example_image.fits

          mv spitzer_example_image.fits docs/md/
          
          jupytext --to ipynb --pipe black --execute docs/md/*.md
          mv docs/md/*.ipynb docs/notebooks/
          ls docs/notebooks
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          MPLBACKEND: "Agg"

      - name: Create function gallery
        shell: bash -l {0}
        run: |
          # move to the scripts directory
          cd scripts

          # now generate the function docs
          python generate_func_docs.py

          cd ..

          ls docs/notebooks

      - name: Set commit sha for RTD
        id: set_commit_sha
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "commit_sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi
          
      - uses: actions/upload-artifact@v6
        with:
          name: notebooks-for-${{ steps.set_commit_sha.outputs.commit_sha }}
          path: docs/notebooks


      - name: Sleep for 10 min
        uses: juliangruber/sleep-action@v1
        with:
          time: 10m

      - name: Trigger RTDs build (Branches)
        if: github.event_name != 'pull_request'
        uses: dfm/rtds-action@main
        with:
          webhook_url: ${{ secrets.RTDS_WEBHOOK_URL }}
          webhook_token: ${{ secrets.RTDS_WEBHOOK_TOKEN }}
          commit_ref: ${{ github.ref }}
      
      - name: Trigger RTDs Build (Pull Requests)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          RTD_TOKEN: ${{ secrets.RTD_AUTH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RTD_PROJECT: "astromodels" 
        run: |
          VERSION_SLUG="${PR_NUMBER}"
          echo "Triggering build for PR version: $VERSION_SLUG"
          
          # We use curl to hit the API v3 directly
          curl -X POST \
            -H "Authorization: Token $RTD_TOKEN" \
            -H "Content-Type: application/json" \
            "https://readthedocs.org/api/v3/projects/$RTD_PROJECT/versions/$VERSION_SLUG/builds/"

      - name: Documentation link for pull request
        if: github.event_name == 'pull_request'
        uses: readthedocs/actions/preview@v1
        with:
          project-slug: "astromodels"

  api_doc:
    name: "Create the API stubs"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Build the API doc
        run: |

          brew install c-blosc
          brew install hdf5

          pip3 install tempita tables
          pip3 install cython blosc2 h5py
          pip3 install numpy scipy numba astropy pandas
          pip3 install wheel pkgconfig

          #python setup.py develop
          pip3 install -e .

          brew install sphinx-doc pandoc

          pip3 install mock 
          pip3 install sphinx-rtd-dark-mode
          pip3 install -U sphinx


          sphinx-apidoc -f -o docs/api/ astromodels

      - name: Set commit sha for RTD
        id: set_commit_sha
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "commit_sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi
      
      - uses: actions/upload-artifact@v6
        with:
          name: api-stubs-for-${{ steps.set_commit_sha.outputs.commit_sha }}
          path: docs/api


  build_docs:
    name: "Build the Documentation"
    runs-on: macos-latest
    needs: [notebooks, api_doc]
    steps:


      - uses: actions/checkout@v6
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install package
        run: |

          brew install c-blosc
          brew install hdf5

          pip3 install tempita
          pip3 install cython blosc2 h5py
          pip3 install numpy scipy numba astropy

          brew install sphinx-doc pandoc

          pip3 install wheel pkgconfig
          pip3 install mock 
          pip3 install sphinx-rtd-dark-mode sphinx-math-dollar
          pip3 install -r docs/requirements.txt

          #python setup.py develop
          pip3 install -e .

          rm -rf docs/md/*

      - name: Set commit sha for RTD
        id: set_commit_sha
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "commit_sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/download-artifact@v7
        with:
          name: notebooks-for-${{ steps.set_commit_sha.outputs.commit_sha }}
          path: docs/notebooks


      - uses: actions/download-artifact@v7
        with:
          name: api-stubs-for-${{ steps.set_commit_sha.outputs.commit_sha }}
          path: docs/api

      - name: Build and Commit
        uses: sphinx-notes/pages@v2
        with:
          documentation_path: docs
          sphinx_version: 9.0.4
          requirements_path: docs/requirements.txt


      - name: Push changes
        if: github.event_name == 'push' #&& startsWith(github.event.ref, 'refs/tags')
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
