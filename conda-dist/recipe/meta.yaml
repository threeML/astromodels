{% set name = "astromodels" %}

package:
  name: {{ name }}
  version: {{ os.environ.get('PKG_VERSION') }}

source:
#  git_url: https://github.com/threeml/{{ name }}.git
  path: ../../

requirements:
  build:
    - python
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - xspec==12.15.1
    - versioneer
    - setuptools
    - pip
    - numpy

  host:
    - python {{ python }}
    - pip
    - setuptools
    - numpy
    - pyyaml
    - pandas
    - xspec==12.15.1
    - future
    - numba
    - h5py>=3.9
    - colorama
    - omegaconf
    - rich
    - joblib
    - versioneer

  run:
    - python
    - numpy
    - pyyaml
    - astropy
    - scipy
    - pytables
    - pandas
    - dill
    - future
    - numba
    - h5py>=3.9
    - colorama
    - omegaconf
    - rich
    - joblib
    - xspec==12.15.1    
    - versioneer

build:
  script: $PYTHON -m pip install --verbose --no-deps --ignore-installed .
  skip: true  # [win]


about:
  home: https://github.com/threeml/astromodels
  license: UNKNOWN
  summary: 'Astromodels contains models to be used in likelihood or Bayesian analysis in astronomy'
  license_family: OTHER

# See
# http://docs.continuum.io/conda/build.html for
# more information about meta.yaml
