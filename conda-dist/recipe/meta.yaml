{% set name = "astromodels" %}

package:
  name: {{ name }}
  version: {{ os.environ.get('PKG_VERSION') }}

source:
#  git_url: https://github.com/threeml/{{ name }}.git
  path: ../../

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}

  host:
    - python {{ python }}
    - pip
    - setuptools
    - numpy
    - pyyaml>=5.1
    - pandas>=0.23
    - xspec==12.15.1
    - future
    - numba>=0.54
    - h5py
    - colorama
    - omegaconf
    - rich
    - joblib

  run:
    - python
    - numpy
    - pyyaml>=5.1
    - astropy>=1.2
    - scipy>=0.14
    - pytables
    - pandas>=0.23
    - dill
    - future
    - numba>=0.54
    - h5py
    - colorama
    - omegaconf
    - rich
    - joblib
    - xspec==12.15.1    

build:
  script: $PYTHON -m pip install --verbose --no-deps --ignore-installed .
  skip: true  # [win]


about:
  home: https://github.com/threeml/astromodels
  license: UNKNOWN
  summary: 'Astromodels contains models to be used in likelihood or Bayesian analysis in astronomy'
  license_family: OTHER

# See
# http://docs.continuum.io/conda/build.html for
# more information about meta.yaml
