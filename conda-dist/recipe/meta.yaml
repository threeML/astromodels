{% set name = "astromodels" %}

package:
  name: {{ name }}
  version: {{ os.environ.get('PKG_VERSION') }}

source:
  git_url: ../../    # path to your local git repo OR a remote URL
  git_rev: HEAD
  git_depth: 0       # make sure tags are available for describe

requirements:
  build:
    - python
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - xspec==12.15.1 # [not (linux and aarch64)]
    - versioneer
    - setuptools
    - pip
    - numpy

  host:
    - python
    - pip
    - setuptools
    - numpy
    - pyyaml
    - pandas
    - numba
    - h5py>=3.9
    - omegaconf
    - rich
    - versioneer

  run:
    - python
    - numpy
    - pyyaml
    - astropy
    - scipy
    - pytables
    - pandas
    - dill
    - numba
    - h5py>=3.9
    - omegaconf
    - rich
    - versioneer
  run_constrained:
    - xspec>=12.15.1 # [not (linux and aarch64)]



build:
  script: $PYTHON -m pip install --verbose --no-deps --ignore-installed .
  skip: true  # [win]

test: # already uses requirements from "run"
  requires:
    - pytest
    - pytest-cov
    - coverage
    - xspec # [not (linux and aarch64)]

  source_files:
    - astromodels/tests
    - pyproject.toml # needed for pytest setup e.g. marks
  commands:
    - pytest -vv astromodels/tests --cov=astromodels --cov-report=term

about:
  home: https://github.com/threeml/astromodels
  license: BSD 3-Clause
  license_file: LICENSE
  license_family: BSD
  summary: Models for astronomy and astrophysics
  description: |
    Astromodels contains models to be used in likelihood or 
    Bayesian analysis in astronomy and astrophysics

  dev_url: https://github.com/threeML/astromodels
  doc_url: https://astromodels.readthedocs.io
