schema_version: 1

context:
  name: astromodels

package:
  name: ${{ name }}
  version: 2.6.0

source:
  git: ../
  rev: HEAD
  depth: 0

build:
  skip: win
  script:
    - rm -rf pfiles
    - pip install --verbose --no-deps --no-build-isolation --ignore-installed .

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - if: not (linux and aarch64)
      then: xspec==12.15.1

  host:
    - python
    - pip
    - setuptools
    - numpy
    - pyyaml
    - pandas
    - numba
    - h5py>=3.9
    - omegaconf
    - rich
    - versioneer

  run:
    - python
    - numpy
    - pyyaml
    - astropy
    - scipy
    - pytables
    - pandas
    - dill
    - numba
    - h5py>=3.9
    - omegaconf
    - rich
    - versioneer

  run_constraints:
    - if: not (linux and aarch64)
      then: xspec>=12.15.1

tests:
  - files:
      source:
        - astromodels
        - pyproject.toml
    requirements:
      run:
        - pytest
        - pytest-cov
        - coverage
        - if: not (linux and aarch64)
          then: xspec
    script:
      - if: not (linux and aarch64)
        then: python -c 'from astromodels.xspec import *'
      - pytest -vv astromodels/tests --cov=astromodels --cov-report=term

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Models for astronomy and astrophysics
  description: |
    Astromodels contains models to be used in likelihood or
    Bayesian analysis in astronomy and astrophysics

  homepage: https://github.com/threeml/astromodels
  repository: https://github.com/threeML/astromodels
  documentation: https://astromodels.readthedocs.io

