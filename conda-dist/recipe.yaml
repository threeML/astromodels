schema_version: 1

context:
  name: astromodels
  version: v2.6.0.dev1 

package:
  name: ${{ name }}
  version: ${{ version}}

source:
  path: ../
 
build:
  skip: win
  script:
    - rm -rf pfiles
    - pip install --verbose --no-deps --no-build-isolation --ignore-installed .

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - if: not (linux and aarch64)
      then: xspec==12.15.1

  host:
    - python
    - pip
    - setuptools
    - numpy
    - pyyaml
    - pandas
    - numba
    - h5py>=3.9
    - omegaconf
    - rich
    - versioneer
    - if: (osx and x86_64)
      then: llvmlite<0.46

  run:
    - python
    - numpy
    - pyyaml
    - astropy
    - scipy
    - pytables
    - pandas
    - dill
    - numba
    - h5py>=3.9
    - omegaconf
    - rich
    - versioneer
    - if: (osx and x86_64)
      then: llvmlite<0.46


  run_constraints:
    - if: not (linux and aarch64)
      then: xspec>=12.15.1

tests:
  - python:
      imports:
        - astromodels
  - script:
      - if: not (linux and aarch64)
        then: python -c "import astromodels.xspec"
      - python -m pytest -vv --pyargs astromodels -c pyproject.toml 
    files:
      source:
        - pyproject.toml
    requirements:
      run:
        - pytest
        - if: not (linux and aarch64)
          then: xspec

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Models for astronomy and astrophysics
  description: |
    Astromodels contains models to be used in likelihood or
    Bayesian analysis in astronomy and astrophysics

  homepage: https://github.com/threeml/astromodels
  repository: https://github.com/threeML/astromodels
  documentation: https://astromodels.readthedocs.io

